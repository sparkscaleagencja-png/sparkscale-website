<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#05040a;--ink:#fff6ee;--mut:#b9afc4;--neon:#5ef2ff;--ig-y:#ffd34d;--ig-o:#fa7e1e;--ig-p:#e1306c;--ig-v:#a23bd6;--ig-b:#5b5bff;
--ig:linear-gradient(90deg,#ffd34d,#fa7e1e 28%,#e1306c 58%,#a23bd6 82%,#5b5bff);--glass:rgba(16,11,26,.9)}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 17px/1.4 "DM Sans",system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.d{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;letter-spacing:-.02em}
.gt{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ambient */
#aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#aurora i{position:absolute;display:block;width:70vmax;height:70vmax;border-radius:50%;opacity:.5;will-change:transform}
#aurora i:nth-child(1){left:-22vmax;top:-26vmax;background:radial-gradient(closest-side,rgba(225,48,108,.5),transparent);animation:dr1 19s ease-in-out infinite alternate}
#aurora i:nth-child(2){right:-24vmax;top:-8vmax;background:radial-gradient(closest-side,rgba(91,91,255,.42),transparent);animation:dr2 23s ease-in-out infinite alternate}
#aurora i:nth-child(3){left:12vmax;bottom:-40vmax;background:radial-gradient(closest-side,rgba(250,126,30,.34),transparent);animation:dr3 17s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(14vmax,9vmax)}}@keyframes dr2{to{transform:translate(-13vmax,12vmax)}}@keyframes dr3{to{transform:translate(9vmax,-9vmax)}}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* scena 3d */
#stage{position:fixed;inset:0;perspective:1700px;perspective-origin:50% 50%;overflow:hidden}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;opacity:0;will-change:transform}
#card{position:absolute;left:0;top:0;width:1000px;height:1340px;transform-style:preserve-3d;will-change:transform}
.lay{position:absolute;transform-style:flat}
.slab{position:absolute;inset:0;border-radius:44px;background:linear-gradient(135deg,#6d4a2a,#54214a 50%,#27235e)}
.halo{position:absolute;inset:-70px;border-radius:110px;background:conic-gradient(from 210deg,#ffd34d,#fa7e1e,#e1306c,#a23bd6,#5b5bff,#ffd34d);filter:blur(60px);opacity:.42;transform:translateZ(-34px);animation:hal 5s ease-in-out infinite alternate}
@keyframes hal{to{opacity:.62}}
.rim{position:absolute;inset:0;border-radius:44px;overflow:hidden;transform:translateZ(1px)}
.rim i{position:absolute;left:50%;top:50%;width:1800px;height:1800px;margin:-900px;background:conic-gradient(#ffd34d,#fa7e1e,#e1306c,#a23bd6,#5b5bff,#e1306c,#ffd34d);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.face{position:absolute;inset:11px;border-radius:34px;overflow:hidden;transform:translateZ(2px);background:radial-gradient(120% 70% at 30% 0,#21122e 0,#0d0916 55%,#07060e 100%)}
.face:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(94,242,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(94,242,255,.045) 1px,transparent 1px);background-size:40px 40px}
.sheen{position:absolute;left:-60%;top:-40%;width:220%;height:180%;background:linear-gradient(115deg,transparent 34%,rgba(255,211,77,.07) 42%,rgba(225,48,108,.11) 47%,rgba(94,242,255,.11) 52%,rgba(162,59,214,.07) 57%,transparent 66%);pointer-events:none}
.back{position:absolute;inset:0;border-radius:44px;transform:translateZ(-30px) rotateY(180deg);background:#0d0916;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.back svg{width:300px;filter:drop-shadow(0 0 30px rgba(255,137,0,.7))}
.in{position:absolute;transform:translateZ(4px)}

/* naglowek */
.ava{left:48px;top:44px;width:150px;height:150px;border-radius:24px;padding:4px;background:var(--ig)}
.ava b{display:block;width:100%;height:100%;border-radius:20px;background:url(img/portret1.jpg) no-repeat;background-size:560px;background-position:-212px -46px}
.who{left:220px;top:38px;width:430px}
.nick{font-weight:700;font-size:24px;line-height:1.2}
.name{font-size:50px;line-height:1.04;background:linear-gradient(100deg,#fff 0 38%,#ffd34d 46%,#ff7fb0 50%,#9ef6ff 54%,#fff 62% 100%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.4s linear infinite;white-space:nowrap}
@keyframes shim{from{background-position:120% 0}to{background-position:-60% 0}}
.ks{font-size:34px;line-height:1.15;margin-top:3px;letter-spacing:.17em;color:#8b8ffb;display:flex}
.ks span{opacity:calc(.08 + .92*var(--c,1));text-shadow:0 -1px 0 rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.22),0 0 calc(var(--h,0)*22px) #ffd34d;transform:translateY(calc((1 - var(--c,1))*-3px));display:inline-block}
.wiek{font-size:19px;color:var(--mut);margin-top:3px}
.prev{left:658px;top:50px;width:212px;height:60px;border-radius:13px;padding:2px;background:var(--ig);background-size:220% 100%;animation:bgm 2.6s linear infinite alternate,puls 1.8s ease-in-out infinite;box-shadow:0 0 22px rgba(225,48,108,.65);cursor:pointer}
.prev span{display:flex;align-items:center;justify-content:center;gap:10px;height:100%;width:100%;background:#0c0814;border-radius:11px;font-weight:700;font-size:21px;letter-spacing:.09em}
.prev svg{width:17px;height:17px;fill:#ffd34d}
.prev:hover span{background:#20102a}
@keyframes bgm{to{background-position:100% 0}}@keyframes puls{50%{box-shadow:0 0 44px rgba(250,126,30,.95),0 0 90px rgba(225,48,108,.35)}}
.running .prev{animation:none;box-shadow:none;opacity:.55}
.ss{right:40px;top:36px;width:62px;padding:0;cursor:pointer}
.ss:before{content:"";position:absolute;inset:-26px -22px}
.ss svg{transition:transform .2s}.ss:hover svg,.ss:focus-visible svg{transform:scale(1.12)}
.ss:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:8px}
.ss svg{display:block;width:100%;animation:ssg 2.6s ease-in-out infinite alternate}
@keyframes ssg{from{filter:drop-shadow(0 0 3px rgba(255,137,0,.45))}to{filter:drop-shadow(0 0 12px rgba(255,137,0,.9))}}
.soc{left:658px;top:128px;display:flex;gap:12px}
.soc a{width:62px;height:62px;border-radius:50%;padding:2px;background:var(--ig);display:block;transform:scale(calc(1 + var(--b,0)*.42));box-shadow:0 0 calc(var(--b,0)*38px) #e1306c}
.soc a span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#0d0916}
.soc svg{width:30px;height:30px;fill:#fff}
.soc a:hover{filter:brightness(1.3)}
.soc small{position:absolute;left:-2px;right:-2px;bottom:-16px;display:block;font-size:11px;text-align:center;color:var(--mut);white-space:nowrap}

/* zdjecie */
.foto{left:210px;top:226px;width:580px;height:580px;border-radius:18px;border:3px solid var(--neon);box-shadow:0 0 22px rgba(94,242,255,.65),inset 0 0 26px rgba(94,242,255,.3);overflow:hidden;background:#000}
.foto i{position:absolute;inset:0;background-repeat:no-repeat;opacity:0;transition:opacity .55s,transform 4s ease-out;transform:scale(1.05)}
.foto i.on{opacity:1;transform:scale(1)}
.dots{left:210px;top:762px;width:580px;display:flex;justify-content:center;gap:12px;transform:translateZ(6px)}
.dots button{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid #fff;transition:background .2s,box-shadow .2s;padding:0}
.dots button.on{background:#ffd34d;box-shadow:0 0 12px #ffd34d}

/* bloki informacyjne */
.blk{position:absolute;background:var(--glass);border:2px solid rgba(94,242,255,.75);border-radius:18px;padding:18px 22px;font-size:18px;line-height:1.36;box-shadow:0 0 26px rgba(94,242,255,.3),0 26px 50px rgba(0,0,0,.6);opacity:var(--p,0);transform:translateZ(calc(14px + var(--p,0)*70px)) translateX(calc((1 - var(--p,0))*var(--dx,0px))) scale(calc(.82 + .18*var(--p,0)));color:var(--ink)}
.blk h3{font-size:13px;letter-spacing:.17em;font-weight:700;color:var(--neon);margin-bottom:7px}
.blk h4{font-size:29px;line-height:1.05;margin-bottom:9px}
.blk p+p{margin-top:8px}.blk .mu{color:var(--mut)}
.bk1{left:-190px;top:236px;width:440px;--dx:80px}
.bk2{left:-165px;top:555px;width:480px;--dx:80px}
.bk3{left:770px;top:226px;width:460px;--dx:-80px;padding:15px 22px}
.bar{display:grid;grid-template-columns:62px 1fr 56px;gap:9px;align-items:center;font-size:15px;margin-top:6px}
.bar u{display:block;height:9px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;text-decoration:none}.bar u i{display:block;height:100%;background:var(--ig);border-radius:9px}.bar b{text-align:right}
.bkr{padding:9px 0;border-top:1px solid rgba(94,242,255,.22);opacity:var(--p,0);transform:translateX(calc((1 - var(--p,0))*-22px));font-size:17px;line-height:1.33}
.bkr:first-child{border-top:0;padding-top:0}
.bkr h3{margin-bottom:3px}
.prs{display:flex;flex-wrap:wrap;gap:5px}.prs span{border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:1px 10px;font-size:14.5px}
.go{display:inline-block;margin-top:7px;padding:7px 15px;border-radius:99px;background:var(--ig);color:#14060e;font-weight:700;text-decoration:none;font-size:15.5px}

/* statystyki */
.st{position:absolute;border-radius:14px;background:var(--glass);border:3px solid var(--c);box-shadow:0 0 calc(10px + var(--q,0)*34px) var(--c);padding:10px 16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.st .hd{display:flex;align-items:baseline;justify-content:center;gap:9px;white-space:nowrap}
.st .hd b{font-size:32px;line-height:1.1;color:#fff}.st .hd span{font-size:15px;font-weight:700;color:var(--c)}
.rows{order:-1}
.rw{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:19px;overflow:hidden;max-height:calc(var(--p,0)*58px);opacity:var(--p,0);white-space:nowrap}
.rw span{color:var(--mut);padding:5px 0}.rw b{font-size:25px;color:#fff}
.rw.h span{color:var(--c);font-weight:700;letter-spacing:.06em}
.shd{position:absolute;transform:translateZ(3px);opacity:var(--q,0);pointer-events:none}
.gg{left:391px;top:806px;width:218px;height:130px;text-align:center;transform-origin:50% 100%}
.gg svg{display:block;width:100%;overflow:visible}
.gg .nd{transform-origin:100px 100px;transition:none}
.gl{fill:#c9bfd6;font:700 10px "DM Sans",sans-serif;letter-spacing:.04em}
.gg b{position:absolute;left:0;right:0;top:64px;font-size:27px;line-height:1;text-shadow:0 0 12px #000,0 0 4px #000;white-space:nowrap}
.gg small{position:absolute;left:0;right:0;top:93px;line-height:1.05;font-size:12.5px;color:var(--mut);white-space:nowrap;text-shadow:0 0 6px #000}

/* dol karty */
.box{position:absolute;border:2px solid rgba(94,242,255,.5);border-radius:14px;background:rgba(10,7,18,.82);padding:12px 15px;font-size:15.5px;line-height:1.34;transform:translateZ(4px);overflow:hidden}
.box h3{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--neon);margin-bottom:5px}
.rv{opacity:var(--v,1);transform:translateY(calc((1 - var(--v,1))*10px))}
.opis{left:44px;top:944px;width:296px;height:190px}.opis q{display:block;quotes:none;font-weight:700;font-size:16.5px;line-height:1.25;margin-bottom:6px}
.inf{left:352px;top:944px;width:186px;height:190px}.inf li{list-style:none;margin:0 0 2px;padding-left:14px;position:relative;font-size:14.5px;line-height:1.22}.inf li+li{margin-top:5px}.inf li:before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ig-p)}
.kpi{left:550px;top:944px;width:150px;height:190px;display:flex;flex-direction:column;justify-content:space-between}
.kpi div{line-height:1.08}.kpi b{display:block;font-size:30px;line-height:1.05}.kpi span{font-size:13px;color:var(--mut);display:block;line-height:1.14;margin-top:1px}
.tab{left:44px;top:1142px;width:656px;height:170px;padding:9px 14px}
.pb{display:block;min-width:64px;height:7px;border-radius:7px;background:rgba(255,255,255,.14);margin-top:4px;overflow:hidden;text-decoration:none}.pb i{display:block;height:100%;border-radius:7px;background:var(--c);box-shadow:0 0 8px var(--c)}
table{width:100%;border-collapse:collapse;font-size:15.5px}th{font-size:11.5px;letter-spacing:.09em;color:var(--neon);text-align:right;padding:2px 5px 5px;font-weight:700;white-space:nowrap}td{padding:5px 5px 4px;border-top:1px solid rgba(255,255,255,.13);text-align:right;font-weight:500;white-space:nowrap}td:first-child,th:first-child{text-align:left;font-weight:700}
.note{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.2}

/* telefon */
.tel{position:absolute;left:728px;top:936px;width:206px;height:368px;border-radius:30px;background:#000;border:3px solid #fff;box-shadow:0 0 22px rgba(255,255,255,.26),0 0 0 2px #333 inset;transform-origin:30% 100%;transform:translateZ(calc(6px + var(--w,0)*50px)) scale(calc(1 + var(--w,0)*.32));padding:7px}
.scr{position:relative;width:100%;height:100%;border-radius:23px;overflow:hidden;background:#100a17}
.tel:after{content:"";position:absolute;left:50%;top:13px;width:56px;height:9px;margin-left:-28px;border-radius:9px;background:#000;box-shadow:inset 0 0 0 1px #2a2a2a}
.reel{position:absolute;inset:0;transition:transform .55s cubic-bezier(.65,0,.2,1)}
.sl{position:absolute;left:0;width:100%;height:100%;background:#0d0813;overflow:hidden;display:flex;flex-direction:column}
.sl .bg{position:absolute;inset:-14px;background-size:cover;background-position:center;filter:blur(11px) brightness(.55)}
.sl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.hdr{position:relative;z-index:3;display:flex;align-items:center;gap:7px;padding:30px 10px 0;font-size:12px;pointer-events:none}
.avr{flex:none;width:30px;height:30px;border-radius:50%;padding:2px;background:var(--ig)}
.avr img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #0d0813}
.hdr b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;text-shadow:0 1px 3px #000}
.hdr i{margin-left:auto;flex:none;display:block;width:18px;height:18px;opacity:.9}.hdr i svg{display:block;width:100%;height:100%;fill:#fff}
.sl .cp{position:relative;z-index:1;padding:9px 12px 0;text-align:center;font:700 13px/1.24 Arial,sans-serif;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000,1px 0 2px #000,-1px 0 2px #000}
.sl .cp.lg{font-size:11px}
.ph{position:relative;flex:1;min-height:0;margin:9px 0 40px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sl.v .cp,.sl.v .ph{display:none}
.acts{position:absolute;right:7px;bottom:48px;z-index:4;display:flex;flex-direction:column;gap:8px}
.acts a{display:block;width:32px;height:32px;border-radius:50%;padding:2px;background:var(--ig);box-shadow:0 0 10px rgba(225,48,108,.6)}
.acts a span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#0d0916}
.acts svg{width:16px;height:16px;fill:#fff}
.tap{position:absolute;inset:0;z-index:2;cursor:pointer;display:block;width:100%}
.lbl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 9px 7px;font-size:10.5px;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none;display:flex;justify-content:space-between;gap:6px;align-items:flex-end}
.lbl a{pointer-events:auto;white-space:nowrap;text-decoration:underline}
.sw{position:absolute;right:-41px;top:50%;width:33px;margin-top:-37px;display:flex;flex-direction:column;gap:8px;opacity:var(--w,0)}
.sw button{width:33px;height:33px;border-radius:50%;border:2px solid #fff;background:rgba(10,7,18,.9);font-size:14px;line-height:1;padding:0}

/* nakladki */
#loader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s}
#loader svg{width:92px;filter:drop-shadow(0 0 22px rgba(255,137,0,.6));animation:ssl 1.3s ease-in-out infinite alternate}
@keyframes ssl{to{transform:scale(1.09);filter:drop-shadow(0 0 36px rgba(255,137,0,.9))}}
#loader .tr{width:min(280px,70vw);height:4px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}#loader .tr i{display:block;height:100%;width:0;background:var(--ig);transition:width .25s}
#loader small{font-size:13px;letter-spacing:.2em;color:var(--mut)}
#flash{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
#flash i{position:absolute;left:50%;top:50%;width:40vmax;height:40vmax;margin:-20vmax;border-radius:50%;opacity:0}
#flash.boom i:nth-child(1){background:conic-gradient(#ffd34d,#fa7e1e,#e1306c,#a23bd6,#5b5bff,#ffd34d);animation:bang .95s cubic-bezier(.15,.7,.2,1)}
#flash.boom i:nth-child(2){border:7px solid #fff;animation:ring .95s cubic-bezier(.1,.7,.2,1)}
#flash.boom i:nth-child(3){border:3px solid #5ef2ff;animation:ring 1.25s .1s cubic-bezier(.1,.7,.2,1)}
@keyframes bang{0%{opacity:.95;transform:scale(.02) rotate(0)}38%{opacity:.8}100%{opacity:0;transform:scale(5) rotate(160deg)}}
@keyframes ring{0%{opacity:1;transform:scale(.05)}100%{opacity:0;transform:scale(4.2)}}
#hud{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translate(-50%,14px);width:min(720px,calc(100vw - 28px));z-index:10;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#hud:before{content:"";position:absolute;left:-90px;right:-90px;top:-40px;bottom:-30px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 50% 70% at 50% 100%,rgba(5,4,10,.88),rgba(5,4,10,0))}
.running #hud{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#segs{display:flex;gap:6px}
#segs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:7px;padding:10px 0 6px;text-align:left;color:#c9bfd6;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;transition:color .15s}
#segs button b{display:inline-block;margin-right:6px;color:var(--ig-o)}
#segs .s{display:none}
#segs u{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.34);overflow:hidden;text-decoration:none;transition:height .15s}
#segs u i{display:block;height:100%;width:0;background:var(--ig)}
#segs button:hover,#segs button:focus-visible,#segs button.on{color:#fff}
#segs button:hover u,#segs button:focus-visible u{height:6px}
#segs button.on b{color:var(--ig-y)}
#segs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#foot{position:fixed;left:24px;bottom:22px;z-index:9;width:210px;font-size:12.5px;line-height:1.35;color:var(--mut);transition:opacity .35s}
.running #foot,.running #rt{opacity:0;pointer-events:none}
#foot a{text-decoration:underline}
#rt{position:fixed;right:24px;bottom:22px;z-index:9;display:flex;flex-direction:column;gap:9px;align-items:stretch;width:220px;transition:opacity .35s}
.bt{display:block;text-align:center;padding:12px 17px;border-radius:99px;font-weight:700;font-size:15px;text-decoration:none}
.bt.a{background:var(--ig);color:#14060e}.bt.b{border:1.5px solid rgba(255,255,255,.3)}.bt.b:hover{border-color:#fff}
#hint{position:fixed;right:24px;bottom:128px;width:220px;text-align:center;z-index:9;color:var(--mut);font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none}
.show-hint:not(.running) #hint{opacity:1}

/* menu pod logo */

function rowsHtml(w){return w.map(r=>r.h?`<div class="rw h"><span>${r.h}</span></div>`:`<div class="rw"><span>${r.l}</span><b data-v="${r.v}" data-d="${r.d}" data-u="${r.u}">${fmt(r.v,r.d)}${r.u}</b></div>`).join('')}
$('#foot').innerHTML=`Karta influencera agencji <b>Spark Scale</b>.<br>${DANE.stopka.split('. ')[1]||''}`;
$('#rt').innerHTML=`<a class="bt a" href="mailto:${DANE.mail}?subject=${encodeURIComponent(DANE.temat)}">Porozmawiajmy</a><a class="bt b" href="${DANE.pdf}" download>Media kit (PDF)</a>`;

/* ---------- os czasu: 1 profil 0-5, 2 info 5-20, 3 staty 20-30, 4 tresci 30-50, 5 karta ---------- */
const TMIN=-1.4,TMAX=51.6;
const SEG=[['Profil',TMIN,5,0],['Kim jest',5,20,5],['Statystyki',20,30,20.8],['Filmy i tabela',30,50,30.3],['Karta',50,TMAX,TMAX]];
let w=innerWidth,h=innerHeight,mobile=false,KEYS=[],VID={a:30,s:5};
const fit=(cx,cy,vW,vH,rx=0,ry=0)=>({cx,cy,z:Math.min(w/vW,h/vH),rx,ry});
// jak fit, ale gorna krawedz kadru stoi na stalej wysokosci karty (top) niezaleznie od proporcji ekranu
const fitT=(cx,top,vW,vH,rx=0,ry=0)=>{const z=Math.min(w/vW,h/vH);return{cx,cy:top+h/(2*z),z,rx,ry}};
function layout(){
  w=innerWidth;h=innerHeight;mobile=w<820&&h>w;document.body.classList.toggle('m',mobile);
  const idle=mobile?fit(500,670,1050,1760):fit(500,670,1090,1400);
  if(!mobile){KEYS=[[TMIN,{...idle,ry:360}],[.1,fit(500,128,1070,430)],[4.6,fit(500,136,1040,430)],[6,fitT(520,205,1500,820)],[19,fitT(520,205,1480,820)],
    [20.7,fit(270,775,783,783,20,-TILT)],[28.8,fit(640,755,783,783,20,-TILT)],[30.3,fit(525,1100,1130,720)],[49.4,fit(525,1104,1110,720)],[TMAX,idle]];VID={a:30,s:3.4};}
  else{KEYS=[[TMIN,{...idle,ry:360}],[.1,fit(500,128,1040,600)],[4.6,fit(500,130,1020,600)],[6,fit(500,740,900,1500)],[19.2,fit(500,740,900,1500)],
    [20.7,fit(230,780,609,1087,16,-TILT*.72)],[24.3,fit(240,780,609,1087,16,-TILT*.72)],[25.2,fit(760,780,609,1087,16,-TILT*.72)],[28.8,fit(770,780,609,1087,16,-TILT*.72)],
    [30.3,fit(192,1040,335,500)],[33.4,fit(192,1040,330,500)],[34.2,fit(445,1040,220,500)],[36.4,fit(445,1040,216,500)],[37.1,fit(625,1040,180,500)],[39.4,fit(625,1040,176,500)],[40.2,fit(372,1225,680,500)],[42.8,fit(372,1225,670,500)],[43.6,fit(830,1110,440,850)],[49.6,fit(830,1110,430,850)],[TMAX,idle]];VID={a:43.6,s:3};}
  // bloki z prawej: desktop narastajaco, mobile po kolei
  $$('.bkr').forEach((el,i)=>{el.dataset.win=mobile?`${12.2+i*1.5},${i==4?19.5:13.6+i*1.5}`:`${9.2+i*1.5},19.5`});
  const c=$('#dust');c.width=w*DPR;c.height=h*DPR;
  dustSeed();
}
function camAt(t){
  t=cl(t,TMIN,TMAX);let i=0;while(i<KEYS.length-2&&t>KEYS[i+1][0])i++;
  const [a,A]=KEYS[i],[b,B]=KEYS[i+1],e=sm((t-a)/(b-a));
  return{cx:lerp(A.cx,B.cx,e),cy:lerp(A.cy,B.cy,e),z:Math.exp(lerp(Math.log(A.z),Math.log(B.z),e)),rx:lerp(A.rx,B.rx,e),ry:lerp(A.ry,B.ry,e)};
}

/* ---------- stan ---------- */
const world=$('#world'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let T=TMIN,shown=TMIN,playing=false,paused=false,lastScrub=-1e9,enter=0,ready=false,idleW=1,px=0,py=0,tx=0,ty=0,slideOff=0,lastSlide=-1,vidOff=0,lastVid=-1,sound=false,armedAt=0;
const windows=$$('[data-win]'),rvs=$$('[data-rv]'),ksL=$$('#ks span'),socL=$$('.soc a');
const rwIg=$$('#stIg .rw'),rwTt=$$('#stTt .rw');
const IGIN=[22,23,23.9,24.8],TTIN=[24.4,24.7,25.6,26.4,26.7,27.6];
const set=(el,k,v)=>{const s=v.toFixed(3);if(el['_'+k]!==s){el['_'+k]=s;el.style.setProperty(k,s)}};

function apply(t,now){
  document.body.classList.toggle('running',t>TMIN+.001&&t<TMAX-.001);
  // kamera
  const c=camAt(t),idle=t<=-1.3||t>=51.4;idleW+=((idle?1:0)-idleW)*.07;
  tx+=(px-tx)*.06;ty+=(py-ty)*.06;
  const fl=reduce?0:idleW,sec=now/1000,
    rx=c.rx-ty*7*idleW+Math.sin(sec*.7)*1.5*fl,ry=(reduce&&t<.1?0:c.ry)+tx*10*idleW+Math.cos(sec*.55)*2.3*fl,
    dy=Math.sin(sec*.9)*7*fl,e=sm(enter),z=c.z*(.72+.28*e);
  world.style.transform=`translate3d(${w/2}px,${h/2+dy}px,0) scale(${z}) rotateX(${rx.toFixed(3)}deg) rotateY(${(ry-(1-e)*55).toFixed(3)}deg) translate(${-c.cx}px,${-c.cy}px)`;
  world.style.opacity=e;
  $('#sheen').style.transform=`translate3d(${((ry%360)*9+Math.sin(sec*.5)*90).toFixed(1)}px,${(rx*-7).toFixed(1)}px,0)`;

  // 1: ryta ksywka i puchnace kolka
  const inK=t>-.2&&t<5.3;
  ksL.forEach((el,i)=>{const a=.5+i*.34,cv=(t<=-.2||t>=5.3)?1:sm((t-a)/.22),hot=(t>a-.1&&t<a+.55)?1-cl((t-a)/.6):0;
    set(el,'--c',cv);set(el,'--h',hot);
    if(hot>.75&&!el._sp&&playing&&t>0){el._sp=1;const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.6,16,['#ffd34d','#fff','#fa7e1e'],2.4)}
    if(t<a-.2)el._sp=0;});
  socL.forEach((el,i)=>{const a=3+i*.45;set(el,'--b',inK?Math.sin(cl((t-a)/.6)*Math.PI):0)});

  // 2: bloki
  for(const el of windows){const v=(mobile&&el.dataset.winM||el.dataset.win).split(','),p=sm((t-v[0])/.7)*(1-sm((t-v[1])/.6));
    set(el,'--p',p);const hid=p<.002;if(el._h!==hid){el._h=hid;el.style.visibility=hid?'hidden':'visible'}}
  const auto=t<10?0:1+Math.floor((t-10)/3);const si=((t>=20?0:auto)+slideOff)%DANE.zdjecia.length;
  if(si!==lastSlide){lastSlide=si;$$('#foto i').forEach((x,i)=>x.classList.toggle('on',i===si));$$('#dots button').forEach((x,i)=>x.classList.toggle('on',i===si))}

  // 3: statystyki wychodza z karty
  const q=sm((t-20.5)/1.2)*(1-sm((t-29)/1.1));
  stat($('#stIg'),$('#shIg'),rwIg,DANE.ig.wiersze,IGIN,t,q,lerp(150,mobile?20:40,q),lerp(222,mobile?460:430,q));
  stat($('#stTt'),$('#shTt'),rwTt,DANE.tt.wiersze,TTIN,t,q,lerp(628,mobile?520:530,q),lerp(222,mobile?460:430,q));
  let s=0;const all=[...DANE.ig.wiersze.map((r,i)=>[r,IGIN[i]]),...DANE.tt.wiersze.map((r,i)=>[r,TTIN[i]])];
  for(const [r,a] of all)if(r.suma)s+=r.suma*(t<21||t>28.6?1:sm((t-a)/1.1));
  $('#sum').textContent=fmt(s,1)+' tys.';
  const f=cl(s/GMAX);$('#ga').style.filter=f>.9?'drop-shadow(0 0 5px rgba(225,48,108,.95))':'';$('#nd').style.transform=`rotate(${(f*180).toFixed(1)}deg)`;$('#ga').setAttribute('stroke-dasharray',`${f.toFixed(3)} 1`);
  $('#gg').style.transform=`translateZ(${4+q*190}px) translateY(${q*(mobile?170:92)}px) scale(${1+q*(mobile?.25:.62)})`;
  $('#foto').style.opacity=1-q*.62;

  // 4: tekst, tabela, telefon
  for(const el of rvs){const a=+el.dataset.rv;const v=t<28.6||t>=50?1-q*.72:t<29.6?(1-sm(t-28.6))*.28:sm((t-a)/.8);set(el,'--v',v)}
  const wt=sm((t-29.6)/1)*(1-sm((t-49.6)/1));const tel=$('#tel');set(tel,'--w',wt);
  const ph=t>=29&&t<50.2,n=DANE.filmy.length;const vi=ph?((Math.max(0,Math.floor((t-VID.a)/VID.s))+vidOff)%n+n)%n:-1;
  if(vi!==lastVid){setVid(vi);lastVid=vi}

  // hud
  $$('#segs u i').forEach((b,i)=>{const[,a,e2]=SEG[i];b.style.width=cl((t-a)/(e2-a))*100+'%'});
  $$('#segs button').forEach((b,i)=>b.classList.toggle('on',t>=SEG[i][1]&&t<SEG[i][2]));
}
function stat(el,sh,rows,data,inn,t,q,left,width){
  const up=q*(mobile?60:110),bottom=906;
  el.style.left=left+'px';el.style.width=width+'px';el.style.bottom=(1340-bottom)+'px';
  el.style.transform=`translateZ(${5+q*135}px) translateY(${-up}px)`;
  set(el,'--q',q);
  sh.style.left=left+'px';sh.style.width=width+'px';sh.style.top=(420+(1-q)*300)+'px';sh.style.height=(490-(1-q)*300)+'px';set(sh,'--q',q*.6);
  rows.forEach((r,i)=>{const a=inn[i],p=sm((t-a)/.6)*(1-sm((t-29)/.8));set(r,'--p',p);const b=r.querySelector('b');
    if(b){const k=sm((t-a)/1),txt=fmt(+b.dataset.v*k,+b.dataset.d)+b.dataset.u;if(b._txt!==txt){b._txt=txt;b.textContent=txt}}});
}
function setVid(i){
  const k=Math.max(i,0),v=DANE.filmy[k];
  $('#reel').style.transform=`translateY(${-k*100}%)`;
  $$('.sl video').forEach(x=>{const on=+x.parentNode.dataset.i===i;x.muted=!(on&&sound);if(on)x.play().catch(()=>{});else x.pause()});
  $('#vl').href=v.url;$('#snd').textContent=v.mp4?(sound?'dźwięk włączony':'dotknij: dźwięk'):v.o;
}

/* ---------- sterowanie ---------- */
function start(fromBtn){
  if(fromBtn){const f=$('#flash');f.classList.remove('boom');void f.offsetWidth;f.classList.add('boom');
    const r=$('#prev').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,150,['#ffd34d','#fa7e1e','#e1306c','#a23bd6','#5ef2ff','#fff'],8)}
  T=shown=TMIN+.002;playing=true;paused=false;slideOff=0;vidOff=0;ksL.forEach(e=>e._sp=0);ppIcon();$('#hint').style.display='none';
}
function stop(){T=shown=TMIN;playing=false;paused=false;armedAt=performance.now();ppIcon()}
function ppIcon(){}   // pasek nawigacji nie ma juz przycisku pauzy (pauza: spacja)
function scrub(d){
  const now=performance.now();
  if(T<=TMIN+.001||T>=TMAX-.001){
    if(!ready||now-armedAt<900)return;
    if(T>=TMAX-.001){if(d<0){T=TMAX-.01;shown=T;playing=true}else return}
    else if(d>0)start(false);else return;
  }
  T=cl(T+d,TMIN,TMAX);lastScrub=now;
  if(T<=TMIN)stop();
}
addEventListener('wheel',e=>{if(menuOpened())return;e.preventDefault();const u=e.deltaMode===1?33:1;scrub(cl(e.deltaY*u,-160,160)*.016)},{passive:false});
let ty0=null;
addEventListener('touchstart',e=>{ty0=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(ty0===null||menuOpened())return;const y=e.touches[0].clientY;scrub((ty0-y)*.03);ty0=y;e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{
  if(menuOpened()){if(e.key==='Escape')menuClose();else if(e.key==='Tab'){const f=[...menu.querySelectorAll('a.mi,button.mx')],a=document.activeElement;
    if(e.shiftKey&&(a===f[0]||!menu.contains(a))){f[f.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&(a===f[f.length-1]||!menu.contains(a))){f[0].focus();e.preventDefault()}}return}
  if(e.key==='ArrowDown'||e.key==='PageDown'){scrub(2);e.preventDefault()}
  if(e.key==='ArrowUp'||e.key==='PageUp'){scrub(-2);e.preventDefault()}
  if(e.key===' '&&document.activeElement.tagName!=='BUTTON'){if(T>TMIN&&T<TMAX){paused=!paused;ppIcon()}else start(true);e.preventDefault()}
  if(e.key==='Escape')stop();
});
addEventListener('pointermove',e=>{px=e.clientX/w*2-1;py=e.clientY/h*2-1},{passive:true});
$('#prev').addEventListener('click',()=>{if(T<=TMIN+.001||T>=TMAX-.001)start(true);});
$('#dots').addEventListener('click',e=>{const i=e.target.dataset.i;if(i===undefined)return;const n=DANE.zdjecia.length,t=shown,auto=t<10?0:1+Math.floor((t-10)/3);slideOff=((+i-auto)%n+n)%n});
$('#vu').addEventListener('click',()=>{vidOff--});$('#vd').addEventListener('click',()=>{vidOff++});

/* ---------- menu pod logo Spark Scale ---------- */
const menu=$('#menu'),menuOpened=()=>document.body.classList.contains('menuopen');let menuFrom=null,KARTY=DANE.karty;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>typeof u==='string'&&/^\/(?!\/)|^https:\/\/spark-scale\.pl\//.test(u);
$('#mlogo').innerHTML=SS;
fetch('/karty.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(l=>{if(Array.isArray(l)&&l.length)KARTY=l.filter(k=>k&&typeof k.nazwa==='string'&&okUrl(k.url))}).catch(()=>{});
function renderMenu(){
  const list=KARTY.some(k=>k.slug===DANE.slug)?KARTY:[...DANE.karty,...KARTY];
  $('#mnav').innerHTML=`<a class="mi" href="/"><span>Strona główna Spark Scale</span><span class="ar" aria-hidden="true">→</span></a>
  <a class="mi" href="/dla-influencera.html"><span>Dla influencera<small>Jak pracujemy z twórcami</small></span><span class="ar" aria-hidden="true">→</span></a>
  <div class="mt">KARTY INFLUENCERÓW</div>`+list.map(k=>{
    const cur=k.slug===DANE.slug,img=okUrl(k.zdjecie)?`<img src="${esc(k.zdjecie)}" alt="" onerror="this.style.display='none'">`:'',
      body=`${img}<span>${esc(k.nazwa)}${k.ksywka?`<small>${esc(k.ksywka)}</small>`:''}</span>`;
    return cur?`<div class="mi cur" aria-current="page">${body}<span class="tag">TA KARTA</span></div>`:`<a class="mi" href="${esc(k.url)}">${body}<span class="ar" aria-hidden="true">→</span></a>`}).join('');
}
function menuOpen(){renderMenu();menu.hidden=false;document.body.classList.add('menuopen');menuFrom=document.activeElement;(menu.querySelector('a.mi')||menu.querySelector('.mx')).focus()}
function menuClose(){menu.hidden=true;document.body.classList.remove('menuopen');if(menuFrom&&menuFrom.focus)menuFrom.focus()}
$('#ssbtn').addEventListener('click',menuOpen);
menu.addEventListener('click',e=>{if(e.target.closest('[data-close]'))menuClose()});
$('#tap').addEventListener('click',()=>{const v=DANE.filmy[Math.max(lastVid,0)];if(!v.mp4){open(v.url,'_blank','noopener');return}
  sound=!sound;if(sound){paused=true;ppIcon()}setVid(lastVid)});
const SHORT=['Profil','Kim jest','Staty','Filmy','Karta'];
$('#segs').innerHTML=SEG.map((s,i)=>`<button data-i="${i}" aria-label="${i+1}. ${s[0]}"><span class="f"><b>${i+1}</b>${s[0]}</span><span class="s"><b>${i+1}</b>${SHORT[i]}</span><u><i></i></u></button>`).join('');
$('#segs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=SEG[+b.dataset.i];T=s[3];lastScrub=performance.now();playing=true;paused=false;if(T>=TMAX)T=TMAX});
addEventListener('resize',layout);

/* ---------- pyl i wybuch ---------- */
const DPR=Math.min(devicePixelRatio||1,1.5),dc=$('#dust').getContext('2d');let dust=[],sparks=[];
function dustSeed(){dust=[];const n=mobile?45:110;for(let i=0;i<n;i++)dust.push({x:Math.random()*w,y:Math.random()*h,d:.25+Math.random()*.9,s:.5+Math.random()*1.5,o:Math.random()*6.28})}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.25+Math.random());sparks.push({x,y,vx:Math.cos(a)*v*1.5,vy:Math.sin(a)*v*1.5,l:1,c:col[i%col.length],r:1+Math.random()*2.4})}}
function drawDust(now,cam,dt){
  dc.setTransform(DPR,0,0,DPR,0,0);dc.clearRect(0,0,w,h);const sec=now/1000;
  dc.fillStyle='#ffd98a';
  for(const p of dust){p.y-=p.d*dt*9;if(p.y<-5)p.y=h+5;
    const x=((p.x-cam.cx*p.d*.09+tx*14*p.d)%w+w)%w,y=((p.y-cam.cy*p.d*.06+ty*10*p.d)%h+h)%h;
    dc.globalAlpha=(.12+.34*(.5+.5*Math.sin(sec*1.2+p.o)))*p.d;dc.fillRect(x,y,p.s,p.s)}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt*60;s.y+=s.vy*dt*60;s.vx*=.965;s.vy=s.vy*.965+.022;s.l-=dt*.95;if(s.l<=0){sparks.splice(i,1);continue}
    dc.globalAlpha=s.l;dc.fillStyle=s.c;dc.fillRect(s.x,s.y,s.r,s.r)}
  dc.globalAlpha=1;
}

/* ---------- petla ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&!paused&&now-lastScrub>1300&&T<TMAX)T=Math.min(TMAX,T+dt);
  shown+=(T-shown)*(1-Math.exp(-dt*(now-lastScrub<1300?7:30)));
  if(Math.abs(T-shown)<.002)shown=T;
  if(playing&&T>=TMAX&&shown>=TMAX-.01){playing=false;shown=T=TMAX;armedAt=now}
  if(ready&&enter<1)enter=Math.min(1,enter+dt/1.15);
  apply(shown,now);drawDust(now,camAt(shown),dt);
  requestAnimationFrame(frame);
}

/* ---------- ladowanie ---------- */
(async()=>{
  layout();
  const urls=[...new Set(DANE.zdjecia.map(z=>z.src))];let done=0;const tot=urls.length+1,tick=()=>{done++;$('#lb').style.width=done/tot*100+'%'};
  const fonts=(document.fonts?document.fonts.load('800 40px "Bricolage Grotesque"').then(()=>document.fonts.ready):Promise.resolve()).catch(()=>{}).then(tick);
  await Promise.race([Promise.all([fonts,...urls.map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>{tick();r()};i.src=u}))]),new Promise(r=>setTimeout(r,6000))]);
  await new Promise(r=>setTimeout(r,650));
  const q=new URLSearchParams(location.search);
  $('#loader').style.opacity=0;setTimeout(()=>$('#loader').remove(),650);
  ready=true;document.body.classList.add('show-hint');armedAt=performance.now();
  if(q.has('t')){enter=1;T=shown=+q.get('t');playing=true;paused=true;ppIcon()}
  window.__seek=t=>{enter=1;T=shown=t;playing=true;paused=true;ppIcon()};
  ppIcon();
})();
requestAnimationFrame(frame);
</script>
</body></html>
